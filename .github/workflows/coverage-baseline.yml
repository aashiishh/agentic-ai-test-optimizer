name: Coverage Baseline

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and JaCoCo report
        run: ./mvnw test

      - name: Determine coverage comparison base
        id: coverage-base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run manual AI agent prepare phase
        run: python3 scripts/ai_test_agent.py --mode manual --phase prepare --scope changed --base-ref "${{ steps.coverage-base.outputs.base_ref }}"

      - name: Publish GitHub Actions summary
        run: python3 scripts/github_summary.py

      - name: Comment summary on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ai-test-reports/github-actions-summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline-report
          path: |
            ai-test-reports/*.md
            ai-test-reports/*.json
            target/site/jacoco/
